# marcobarrios.fi GeoIP Update configuration
# /etc/GeoIP.conf

# Documentation: https://dev.maxmind.com/geoip/updating-databases/
# Documentation: https://github.com/maxmind/geoipupdate/blob/main/doc/GeoIP.conf.md

# MaxMind account ID
AccountID ${MAXMIND_ACCOUNT_ID}

# MaxMind license key
LicenseKey ${MAXMIND_LICENSE_KEY}

# MaxMind edition IDs
EditionIDs ${EDITION_IDS}

# Database directory
DatabaseDirectory ${DATA_DIR}