# marcobarrios.fi Mosquitto Configuration
# /etc/mosquitto/mosquitto.conf

# Documentation: https://mosquitto.org/man/mosquitto-conf-5.html

### Authentication

# Documentation: https://mosquitto.org/man/mosquitto_passwd-1.html

# Allow anonymous connections (default is true)
allow_anonymous false

# Password file
password_file /etc/mosquitto/passwd

### Logging

# Set log destination to stdout
log_dest stdout

# Set log destination to log file
log_dest file ${LOG_FILE}

# Set log timestamp format to ISO 8601 string
log_timestamp_format %Y-%m-%dT%H:%M:%S

### Persistence

# Enable persistence (default is false)
# persistence true

# Set persistence file (default is mosquitto.db)
# persistence_file mosquitto.db

# Set persistence file location
# persistence_location ${DATA_DIR}/

### Ports

# Set MQTT port (default is 1883)
listener ${MQTT_PORT}