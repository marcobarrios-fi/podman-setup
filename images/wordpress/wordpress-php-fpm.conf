; marcobarrios.fi WordPress PHP-FPM Configuration
; /etc/php/php-fpm.d/wordpress-php-fpm.conf

; WordPress Pool Configuration

; Pool name
[wordpress]

;User and group for the child processes
user = ${USER}
group = ${GROUP}

; Pool address (Unix or TCP socket on which to accept FastCGI requests)
; listen = /run/php/php-fpm.sock
listen = ${PHP_FPM_SOCKET}

; Allowed FastCGI clients
; Restricts access to the FastCGI server to localhost only
; listen.allowed_clients = 127.0.0.1

; Process management
; Child processes are created on-demand, which is suitable for machines with low resources
pm = ondemand

; Maximum number of child processes
pm.max_children = 4

; Maximum idle timeout for a child process
; Idle child processes will be terminated after the given time
pm.process_idle_timeout = 6s