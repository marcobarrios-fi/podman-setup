# marcobarrios.fi NGINX PHP FastCGI Process Manager Configuration
# /etc/nginx/php-fpm.conf

# Matches all files with a php extension (case-insensitive)
location ~* \.php$ {
  try_files $uri =404;
  include fastcgi.conf;
  # PHP-FPM Socket
  # (default value is unix:/run/php/php8.4-fpm.sock)
  # fastcgi_pass unix:/run/php/php-fpm.sock;
  fastcgi_pass $PHP_FPM_SOCKET;
}