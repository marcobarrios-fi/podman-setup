# marcobarrios.fi NGINX Configuration
# /etc/nginx/nginx.conf

### Core Configuration
# https://nginx.org/en/docs/ngx_core_module.html

# Run NGINX as a daemon (on by default)
# Disable the daemon directive when running Nginx in a container.
daemon off;

# User and group (nobody by default)
user ${USER};

# Number of worker processes (1 by default)
worker_processes auto;

# Just-in-time compilation of regular expressions (off by default)
# Enabling pcre_jit directive can speed up processing of regular expressions significantly.
pcre_jit on;

### Log Configuration

# Error log and log level
error_log ${LOG_FILE} warn;

### Additional Configuration Files

# Includes dynamic module configuration files
include /etc/nginx/modules/*.conf;

# Include additional configuration files in the root context
include /etc/nginx/conf.d/*.conf;

### Events Context Configuration

events {

  # Maximum number of simultaneous connections (512 by default)
	worker_connections 512;

}

### HTTP Context Configuration

http {

  # Server name hash tables maximum size (default 512)
  server_names_hash_max_size 1024;

  # Default MIME type
	default_type application/octet-stream;
  
  # MIME type mappings
	include /etc/nginx/mime.types;

	# Include NGINX version number on error pages and in Server response headers (on by default)
  # Disable the server_tokens directive to reduce information exposure and improve security.
	server_tokens off;
  
  ### SSL Configuration
  # https://nginx.org/en/docs/http/ngx_http_ssl_module.html

  # SSL protocols (TLSv1 TLSv1.1 TLSv1.2 by default)
  # Disable support for TLS 1.0 and TLS 1.1 as they contain security vulnerabilities.
	ssl_protocols TLSv1.2 TLSv1.3;

	# Use server ciphers instead of client ciphers (off by default)
  # Enable ssl_prefer_server_ciphers directive when TLS version 1.0 and TLS version 1.1 are enabled.
	# ssl_prefer_server_ciphers off;

	# TLS session tickets (on by default)
	ssl_session_tickets off;
  
  ### Gzip Configuration
  # https://nginx.org/en/docs/http/ngx_http_gzip_module.html

	# Gzip compression (off by default)
	gzip on;

  # Compression level (1 by default)
  # Higher values result in better compression and lower values in faster compression.
  # The value must be a number between 1 and 9.
  gzip_comp_level 6;

  # Minimum response length for compression
  # Avoid compressing very small files to improve server performance.
  gzip_min_length 1024;

  # Serve pre-compressed files
  # Files are not compressed on-demand.
  gzip_static on;

  # Compression on proxied requests
  gzip_proxied no-cache no-store private expired auth;

  # Compressed MIME types 
  # Notice that HTML files are always compressed.
  gzip_types *;

  # Vary: Accept-Encoding response headers (off by default)
  # Only serve cached resources if the headers match the request.
	gzip_vary on;

  # Optimizing Performance for Serving Static Content
  # https://docs.nginx.com/nginx/admin-guide/web-server/serving-static-content/

	# Use sendfile to serve files (off by default)
  # Enabling the sendfile directive allows NGINX to serve files directly from disk without copying the data into a buffer first.
	# sendfile on;

	# Attempt to send response headers in one packet (off by default)
  # The tcp_nopush directive is only applicable when the sendfile directive is enabled.
  # Allows NGINX to send HTTP response headers in one packet right after the chunk of data has been obtained by sendfile.
	# tcp_nopush on;

	# WebSocket Proxy Configuration
  # https://nginx.org/en/docs/http/websocket.html

  # Include GeoIP configuration
  include /etc/nginx/geoip.conf;

  # Include virtual host configuration files
  include /etc/nginx/http.d/*.conf;
  include ${DATA_DIR}/hosts/*.conf;

}