# marcobarrios.fi NGINX FastCGI Custom Parameters
# /etc/nginx/fastcgi.conf

# Script filename FastCGI parameter
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

# GeoIP continent code FastCGI parameter
fastcgi_param CONTINENT_CODE $geoip_continent_code;

# GeoIP country code FastCGI parameter
fastcgi_param COUNTRY_CODE $geoip_country_code;

# GeoIP country name FastCGI parameter
fastcgi_param COUNTRY_NAME $geoip_country_name;