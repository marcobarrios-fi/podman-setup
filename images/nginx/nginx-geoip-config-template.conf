# marcobarrios.fi NGINX GeoIP Configuration
# /etc/nginx/geoip.conf

### NGINX GeoIP Variables

# Documentation: https://docs.nginx.com/nginx/admin-guide/security-controls/controlling-access-by-geoip/

# Set GeoIP continent, country code, and country name variables
geoip2 '${GEOIP_COUNTRY_DB}' {
  $geoip_continent_code continent code;
  $geoip_country_code country iso_code;
  $geoip_country_name country names en;
}

# Set GeoIP city name variable
geoip2 '${GEOIP_CITY_DB}' {
  $geoip_city_name city names en;
}

# Set GeoIP European Union geolocation variable
map $geoip_continent_code $geolocation_european_union {
  default no;
  EU yes;
}

# Set GeoIP high-risk countries geolocation variable
# High-risk countries include Brazil, China, Iran, North Korea, and Russia
map $geoip_country_code $geolocation_high_risk_countries {
  default no;
  BR yes;
  CN yes;
  IR yes;
  KP yes;
  RU yes;
}